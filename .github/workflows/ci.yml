name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - go: minimum
            version: ""
            version_file: go.mod
          - go: stable
            version: stable
            version_file: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.version }}
          go-version-file: ${{ matrix.version_file }}
          cache: true

      - name: Check module files
        run: go mod tidy -diff

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [[ -n "$files" ]]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build commands
        run: go build -trimpath ./cmd/...

  kind-e2e:
    name: kind end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.20.0
          node_image: kindest/node:v1.28.0@sha256:b7a4cad12c197af3ba43202d3efe03246b3f0793f162afb40a33c923952d5b31
          kubectl_version: v1.28.0
          wait: 120s

      - name: Create test workload
        run: |
          kubectl apply -f test/e2e/testdata/workload.yaml
          kubectl rollout status deployment/rightsizer-e2e --namespace pod-rightsizer-e2e --timeout=180s

      - name: Verify server-side dry-run does not mutate workload
        env:
          RUN_KIND_E2E: "1"
        run: go test -v ./test/e2e

  release-snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Smoke test the packaged commands and Advisor UI
        run: bash scripts/check-release.sh

  site:
    name: Website checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check local links and assets
        run: python3 scripts/check-site.py

      - name: Check JavaScript syntax
        run: |
          node --check site/theme.js
          node --check site/app.js

  contracts:
    name: Analysis contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate schemas and fixtures
        run: bash scripts/check-contracts.sh

  node-http-fixture:
    name: Node HTTP fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: test/fixtures/node-http/package-lock.json

      - name: Check the reference fixture
        run: bash scripts/check-node-http.sh

      - name: Install the pinned external k6 runner
        run: |
          bash scripts/install-fixture-k6.sh "$RUNNER_TEMP/fixture-k6/bin"
          echo "$RUNNER_TEMP/fixture-k6/bin" >> "$GITHUB_PATH"

      - name: Check the k6 scenario and wrong-answer gate
        run: npm --prefix test/fixtures/node-http run test:k6

  check:
    name: CI passed
    if: always()
    needs: [test, kind-e2e, release-snapshot, site, contracts, node-http-fixture]
    runs-on: ubuntu-24.04
    timeout-minutes: 1

    steps:
      - name: Require every check to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          KIND_RESULT: ${{ needs.kind-e2e.result }}
          SNAPSHOT_RESULT: ${{ needs.release-snapshot.result }}
          SITE_RESULT: ${{ needs.site.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          NODE_HTTP_RESULT: ${{ needs.node-http-fixture.result }}
        run: |
          for result in "$TEST_RESULT" "$KIND_RESULT" "$SNAPSHOT_RESULT" "$SITE_RESULT" "$CONTRACTS_RESULT" "$NODE_HTTP_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "A required CI job did not succeed: $result"
              exit 1
            fi
          done
