apiVersion: batch/v1
kind: Job
metadata:
  name: pod-rightsizer
  namespace: default
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: pod-rightsizer-sa
      containers:
      - name: pod-rightsizer
        # Build and publish a multi-architecture image, then replace this placeholder.
        image: YOUR_REGISTRY/pod-rightsizer:YOUR_TAG
        imagePullPolicy: IfNotPresent
        command:
        - /pod-rightsizer
        args:
        - --target=http://nginx.default.svc.cluster.local
        - --deployment=nginx
        - --container=nginx
        - --namespace=default
        - --duration=5m
        - --rps=500
        - --min-actual-rps=475
        - --max-http-error-rate=1
        - --max-p95-latency=1s
        - --cpu-percentile=95
        - --cpu-request-buffer=10
        - --memory-buffer=20
        - --cpu-limit-policy=none
        - --memory-limit-policy=request-multiplier
        - --memory-limit-multiplier=1.2
        - --min-samples=3
        - --output-format=text
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      restartPolicy: Never
---
# Service Account with required permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-rightsizer-sa
  namespace: default
---
# Role with permissions to read the target Deployment, pods, and pod metrics.
# The CLI only writes a patch file; it does not patch the cluster itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-rightsizer-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
# Role binding to connect service account with role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-rightsizer-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: pod-rightsizer-sa
  namespace: default
roleRef:
  kind: Role
  name: pod-rightsizer-role
  apiGroup: rbac.authorization.k8s.io
